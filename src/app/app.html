<header class="app-header">
  <a class="brand" routerLink="/courses">Thaheen</a>
</header>

@if (flashMessage.message(); as message) {
  <div class="flash" role="status">
    <span>{{ message }}</span>
    <button type="button" (click)="flashMessage.dismiss()" aria-label="إغلاق الرسالة">×</button>
  </div>
}

<main class="app-main">
  <router-outlet />
</main>
